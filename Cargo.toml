[package]
name = "geolonia-japanese-addresses-accompanist"
version = "0.2.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
